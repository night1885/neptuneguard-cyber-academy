name: Formal review persistence acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: formal-review-postgres-${{ github.ref }}
  cancel-in-progress: true
jobs:
  formal-review-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: formal_review_admin
          POSTGRES_PASSWORD: disposable_formal_review_admin_only
          POSTGRES_DB: formal_review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formal_review_admin -d formal_review_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORMAL_REVIEW_TEST_DATABASE_URL: postgresql://formal_review_admin:disposable_formal_review_admin_only@127.0.0.1:5432/formal_review_test
      CERTIFICATION_ENABLED: 'false'
      CERTIFICATION_DATABASE_URL: ''
      DATABASE_URL: ''
      DISCORD_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require disposable database and unskipped persistence acceptance
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FORMAL_REVIEW_TEST_DATABASE_URL"
          node --check formal-review-postgres.mjs
          node --test test-certification-formal-review-core.mjs test-certification-formal-review-postgres.mjs test-certification-formal-review-integration.mjs test-certification-formal-review-owner.mjs 2>&1 | tee "$RUNNER_TEMP/formal-review.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/formal-review.tap"
      - name: Validate saved report controls with restricted PostgreSQL storage
        shell: bash
        run: |
          set -euo pipefail
          node --check formal-review-saved-interactions.mjs
          node --test test-certification-formal-review-saved-postgres.mjs 2>&1 | tee "$RUNNER_TEMP/formal-review-saved.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/formal-review-saved.tap"
      - name: Validate administrator course removal and original retention events
        shell: bash
        run: |
          set -euo pipefail
          node --check certification-course-removal.mjs
          node --test test-certification-course-removal-postgres.mjs 2>&1 | tee "$RUNNER_TEMP/course-removal.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/course-removal.tap"
      - name: Validate review removal authorization with a restricted reader role
        shell: bash
        run: |
          set -euo pipefail
          node --test test-certification-formal-review-removal-reader-postgres.mjs 2>&1 | tee "$RUNNER_TEMP/review-removal-reader.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/review-removal-reader.tap"
      - name: Validate owner controls and receipt recovery with restricted PostgreSQL storage
        shell: bash
        run: |
          set -euo pipefail
          node --check test-certification-formal-review-owner-postgres.mjs
          node --test test-certification-formal-review-owner-postgres.mjs 2>&1 | tee "$RUNNER_TEMP/formal-review-owner.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/formal-review-owner.tap"
      - name: Validate composition with PostgreSQL and fictional source HTTP responses
        shell: bash
        run: |
          set -euo pipefail
          node --check formal-review-composition.mjs
          node --test test-certification-formal-review-composition-postgres.mjs 2>&1 | tee "$RUNNER_TEMP/formal-review-composition.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/formal-review-composition.tap"
