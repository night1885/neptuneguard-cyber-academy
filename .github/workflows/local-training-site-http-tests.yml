name: Local training site bounded HTTP checks
on:
  pull_request:
    branches: [formal-ethical-hacking-programme]
    paths:
      - 'docs/formal-ethical-hacking/fixtures/local-training-site/**'
      - '.github/workflows/local-training-site-http-tests.yml'
permissions:
  contents: read
jobs:
  transport:
    name: Non-root six-attempt loopback HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bounded owned-loopback probe
        working-directory: docs/formal-ethical-hacking/fixtures/local-training-site
        run: python -B -m unittest -v test_training_site_http
