name: Certification foundation tests

on:
  push:
    branches: [feature/certification-dashboard]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certification-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certification-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check certification module syntax
        run: |
          for file in certification-*.js; do node --check "$file" || exit 1; done
      - name: Validate unapplied entry-point patch
        run: git apply --check --unidiff-zero patches/certification-entrypoint.patch
      - name: Run certification tests
        run: node --test test-certification-*.mjs
