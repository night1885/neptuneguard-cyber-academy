name: Certification foundation tests

on:
  push:
    branches: [feature/certification-dashboard]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certification-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certification-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check certification module syntax
        run: |
          for file in certification-*.js; do node --check "$file" || exit 1; done
      - name: Check entry-point syntax
        run: node --check index.js
      - name: Run certification tests
        run: node --test test-certification-*.mjs

  certification-postgres-tests:
    name: certification-postgres-tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: certification_ci
          POSTGRES_PASSWORD: disposable_ci_fixture_only
          POSTGRES_DB: certification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U certification_ci -d certification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CERTIFICATION_TEST_DATABASE_URL: postgresql://certification_ci:disposable_ci_fixture_only@127.0.0.1:5432/certification_test
      CERTIFICATION_TEST_ALLOW_ROLE_DDL: 'true'
      CERTIFICATION_TEST_ALLOW_LAB_DDL: 'true'
      CERTIFICATION_ENABLED: 'false'
      DATABASE_URL: ''
      DISCORD_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Require explicit disposable database and role-test configuration
        run: |
          test -n "$CERTIFICATION_TEST_DATABASE_URL"
          test "$CERTIFICATION_TEST_ALLOW_ROLE_DDL" = true
          test "$CERTIFICATION_TEST_ALLOW_LAB_DDL" = true
      - name: Run real PostgreSQL certification integration tests
        run: node --test test-certification-postgres.mjs test-certification-agreement-immutability.mjs test-certification-postgres-readiness.mjs test-certification-database-pool.mjs test-certification-postgres-role.mjs test-certification-lab-postgres.mjs test-certification-student-record-postgres.mjs test-certification-lab-review-postgres.mjs test-certification-owner-registration-postgres.mjs
