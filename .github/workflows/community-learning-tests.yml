name: Community learning access policy
on:
  push:
    branches: [community-learning-verified-linux]
    paths: ['community-learning-policy.mjs', 'test-community-learning-policy.mjs', '.github/workflows/community-learning-tests.yml']
  pull_request:
    paths: ['community-learning-policy.mjs', 'test-community-learning-policy.mjs', '.github/workflows/community-learning-tests.yml']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test-community-learning-policy.mjs
