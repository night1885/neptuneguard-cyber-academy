name: Community learning access policy
on:
  push:
    branches: [community-learning-verified-linux]
    paths: ['community-learning-*.mjs', 'test-community-learning-*.mjs', 'course-registry.js', 'course-content.js', 'fundamentals-stage-*.js', 'linux-administration.js', 'linux-security-engineering.js', 'module-progress.js', 'certification-student-course-content.js', '.github/workflows/community-learning-tests.yml']
  pull_request:
    paths: ['community-learning-*.mjs', 'test-community-learning-*.mjs', 'course-registry.js', 'course-content.js', 'fundamentals-stage-*.js', 'linux-administration.js', 'linux-security-engineering.js', 'module-progress.js', 'certification-student-course-content.js', '.github/workflows/community-learning-tests.yml']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test-community-learning-*.mjs
