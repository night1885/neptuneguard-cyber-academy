name: Age declaration policy tests
on:
  push:
    paths:
      - 'certification-*.js'
      - 'test-certification-age-declaration.mjs'
      - 'test-certification-account-acknowledgment.mjs'
      - 'test-certification-limited-data-backend.mjs'
      - 'migrations/005-account-acknowledgment-age.sql'
      - '.github/workflows/age-declaration-tests.yml'
  pull_request:
    paths:
      - 'certification-*.js'
      - 'test-certification-age-declaration.mjs'
      - 'test-certification-account-acknowledgment.mjs'
      - 'test-certification-limited-data-backend.mjs'
      - 'migrations/005-account-acknowledgment-age.sql'
      - '.github/workflows/age-declaration-tests.yml'
permissions:
  contents: read
jobs:
  age-declaration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test test-certification-age-declaration.mjs test-certification-account-acknowledgment.mjs test-certification-limited-data-backend.mjs
