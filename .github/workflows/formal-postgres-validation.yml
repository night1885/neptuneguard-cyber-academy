name: Formal PostgreSQL restricted-reader validation
on:
  push:
    branches: [formal-ethical-hacking-programme]
    paths:
      - 'test-formal-review-postgres.mjs'
      - '.github/workflows/formal-postgres-validation.yml'
      - 'migrations/**'
      - 'certification-*.js'
      - 'certification-*.mjs'
      - 'docs/formal-ethical-hacking/authoring/discord-workspace-prototype/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: formal-postgres-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formal_ci_admin
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: certification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formal_ci_admin -d certification_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FORMAL_REVIEW_CI: 'true'
      CERTIFICATION_TEST_DATABASE_URL: postgresql://formal_ci_admin:ci-disposable-only@127.0.0.1:5432/certification_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real migrated policy and restricted reader checks
        run: node --test test-formal-review-postgres.mjs
