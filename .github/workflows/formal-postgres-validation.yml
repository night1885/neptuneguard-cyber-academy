name: Formal PostgreSQL restricted-reader validation
on:
  push:
    branches: [formal-ethical-hacking-programme, feat/protected-workspace-integration, feat/fictional-reviewer-validation, main]
    paths:
      - 'test-formal-review-postgres.mjs'
      - 'test-formal-staging-db-package.mjs'
      - '.github/workflows/formal-postgres-validation.yml'
      - 'migrations/**'
      - 'certification-*.js'
      - 'certification-*.mjs'
      - 'docs/formal-ethical-hacking/authoring/discord-workspace-prototype/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'test-formal-review-postgres.mjs'
      - 'test-formal-staging-db-package.mjs'
      - '.github/workflows/formal-postgres-validation.yml'
      - 'migrations/**'
      - 'certification-*.js'
      - 'certification-*.mjs'
      - 'docs/formal-ethical-hacking/authoring/discord-workspace-prototype/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: formal-postgres-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formal_ci_admin
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: certification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formal_ci_admin -d certification_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FORMAL_REVIEW_CI: 'true'
      CERTIFICATION_TEST_DATABASE_URL: postgresql://formal_ci_admin:ci-disposable-only@127.0.0.1:5432/certification_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real migrated policy and restricted reader checks
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap test-formal-review-postgres.mjs 2>&1 | tee "$RUNNER_TEMP/formal-pg.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lines = readFileSync(process.env.RUNNER_TEMP + '/formal-pg.log', 'utf8').split(/\r?\n/);
          const failed = lines.map((line, index) => /^\s*not ok\b/.test(line) ? index : -1).filter(index => index >= 0);
          const starts = failed.length ? failed.slice(0, 3) : [0];
          for (const start of starts) {
            let text = lines.slice(start, start + 32).join('\n')
              .replace(/postgres(?:ql)?:\/\/[^\s'"<>]+/gi, '[redacted-connection-url]')
              .replace(/\bPASSWORD\s+'[^']*'/gi, "PASSWORD '[redacted]'").slice(0, 6000);
            text = text.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            console.log('::error title=Formal PostgreSQL test failure::' + text);
          }
          NODE
          fi
          exit "$status"
  staging_database:
    name: staging-database-package (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: formal_ci_admin
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: certification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formal_ci_admin -d certification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORMAL_STAGING_DB_CI: 'true'
      FORMAL_STAGING_TEST_POSTGRES: ${{ matrix.postgres }}
      CERTIFICATION_TEST_DATABASE_URL: postgresql://formal_ci_admin:ci-disposable-only@127.0.0.1:5432/certification_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require psql client and validate test syntax
        run: |
          command -v psql
          node --check test-formal-staging-db-package.mjs
      - name: Execute exact staging driver and grants in the disposable database
        run: node --test test-formal-staging-db-package.mjs
