name: Admin dashboard regression tests

on:
  push:
    branches: [feature/admin-dashboard-controls]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dashboard-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_TOKEN: ''
      DATABASE_URL: ''
      CERTIFICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check certification module syntax
        run: |
          for file in certification-*.js; do node --check "$file" || exit 1; done
      - name: Run mocked certification regression tests
        run: node --test test-certification-*.mjs
