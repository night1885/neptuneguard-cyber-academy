name: Manual-review migration acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'certification-**'
      - 'test-certification-**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/manual-review-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-review-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual_review_pg16:
    name: manual-review-migration (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      context: ${{ steps.actual.outputs.context }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: manual_review_ci
          POSTGRES_PASSWORD: disposable_ci_fixture_only
          POSTGRES_DB: certification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manual_review_ci -d certification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CERTIFICATION_TEST_DATABASE_URL: postgresql://manual_review_ci:disposable_ci_fixture_only@127.0.0.1:5432/certification_test
      CERTIFICATION_TEST_ALLOW_MANUAL_REVIEW_DDL: 'true'
      CERTIFICATION_ENABLED: 'false'
      DATABASE_URL: ''
      DISCORD_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Require disposable database test configuration
        run: |
          test -n "$CERTIFICATION_TEST_DATABASE_URL"
          test "$CERTIFICATION_TEST_ALLOW_MANUAL_REVIEW_DDL" = true
      - name: Check manual-review source and test syntax
        run: |
          for file in certification-manual-review*.mjs test-certification-manual-review*.mjs; do node --check "$file" || exit 1; done
      - name: Run actual acceptance tests and capture bounded failure context
        id: actual
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys, tempfile
          context, status = 'pg16_ready', 0
          for stage, filename in [('migration', 'test-certification-manual-review-postgres.mjs'), ('native', 'test-certification-manual-review-native-postgres.mjs')]:
              with tempfile.TemporaryFile() as output:
                  try:
                      result = subprocess.run(['node', '--test', filename], stdout=output, stderr=subprocess.STDOUT, timeout=120)
                      if result.returncode == 0:
                          continue
                      output.seek(0)
                      text = output.read(262144).decode('utf-8', errors='replace')
                      lines = re.findall(re.escape(filename) + r':([0-9]{1,5})(?::[0-9]{1,5})?', text)
                      line = int(lines[-1]) if lines else 0
                      codes = re.findall(r"\bcode:\s*['\"]([A-Z0-9_]{1,40})['\"]", text)
                      code = codes[0] if codes else 'unknown'
                      if not re.fullmatch(r'[0-9A-Z]{5}|ERR_ASSERTION|ERR_MODULE_NOT_FOUND|ERR_TEST_FAILURE', code):
                          code = 'unknown'
                      context = f'pg16_{stage}_L{line}_{code}'
                  except subprocess.TimeoutExpired:
                      context = f'pg16_{stage}_timeout'
                  status = 1
                  break
          assert re.fullmatch(r'pg16_(ready|(migration|native)_(timeout|L[0-9]{1,5}_(unknown|[0-9A-Z]{5}|ERR_ASSERTION|ERR_MODULE_NOT_FOUND|ERR_TEST_FAILURE)))', context)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('context=' + context + chr(10))
          print(context)
          sys.exit(status)
          PY

  manual_review_pg18:
    name: manual-review-migration (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: manual_review_ci
          POSTGRES_PASSWORD: disposable_ci_fixture_only
          POSTGRES_DB: certification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manual_review_ci -d certification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CERTIFICATION_TEST_DATABASE_URL: postgresql://manual_review_ci:disposable_ci_fixture_only@127.0.0.1:5432/certification_test
      CERTIFICATION_TEST_ALLOW_MANUAL_REVIEW_DDL: 'true'
      CERTIFICATION_ENABLED: 'false'
      DATABASE_URL: ''
      DISCORD_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Require disposable database test configuration
        run: |
          test -n "$CERTIFICATION_TEST_DATABASE_URL"
          test "$CERTIFICATION_TEST_ALLOW_MANUAL_REVIEW_DDL" = true
      - name: Check manual-review source and test syntax
        run: |
          for file in certification-manual-review*.mjs test-certification-manual-review*.mjs; do node --check "$file" || exit 1; done
      - name: Run exact migration and invalid-state acceptance in a fresh disposable database
        run: node --test test-certification-manual-review-postgres.mjs
      - name: Run native pilot submission and private owner inspection with simulated Discord and real PostgreSQL
        run: node --test test-certification-manual-review-native-postgres.mjs

  pg16_context:
    name: manual-review-pg16-actual-context (${{ needs.manual_review_pg16.outputs.context || 'missing' }})
    needs: manual_review_pg16
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Preserve the actual job result without raw output
        env:
          CONTEXT: ${{ needs.manual_review_pg16.outputs.context }}
          RESULT: ${{ needs.manual_review_pg16.result }}
        run: |
          test -n "$CONTEXT"
          test "$RESULT" = success
