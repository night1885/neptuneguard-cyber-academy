name: Standalone web receipt SQL - explicit disposable validation
on:
  push:
    branches: [feat/fictional-reviewer-validation]
    paths:
      - 'standalone-web-save-receipts.candidate.sql'
      - 'standalone-web-save-receipts.postgres.test.mjs'
      - '.github/workflows/standalone-web-receipts.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: standalone-web-receipts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  receipt-sql:
    if: github.repository == 'night1885/neptuneguard-cyber-academy' && github.ref == 'refs/heads/feat/fictional-reviewer-validation' && contains(github.event.head_commit.message, '[receipt-sql-validate]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: web_review_ci_owner
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: ng_web_review_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U web_review_ci_owner -d ng_web_review_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      WEB_REVIEW_PG_MAJOR: '${{ matrix.postgres }}'
      WEB_REVIEW_TEST_DATABASE_URL: postgresql://web_review_ci_owner:ci-disposable-only@127.0.0.1:5432/ng_web_review_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install existing locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact reviewed receipt SQL bytes
        shell: bash
        run: |
          printf '%s  %s\n' 'f4d867645144c37e6fd1d8507aeda55fc8f4c9808bda6b4fd7eed5daba28fc49' 'standalone-web-save-receipts.candidate.sql' | sha256sum --check --strict -
      - name: Check receipt runner syntax without connecting
        run: node --check standalone-web-save-receipts.postgres.test.mjs
      - name: Check disabled runner only - expected skip is not database acceptance
        env:
          WEB_REVIEW_RECEIPT_SQL_CI: 'false'
        run: node --test standalone-web-save-receipts.postgres.test.mjs
      - name: Existing detached core lifecycle adapter and snapshot contracts
        run: node --test standalone-web-rehearsal-core.test.mjs standalone-web-rehearsal-lifecycle.test.mjs standalone-web-rehearsal-postgres.test.mjs standalone-web-rehearsal-snapshot.test.mjs
      - name: Actual disposable receipt SQL acceptance
        env:
          WEB_REVIEW_RECEIPT_SQL_CI: 'true'
        run: node --test --test-concurrency=1 standalone-web-save-receipts.postgres.test.mjs
