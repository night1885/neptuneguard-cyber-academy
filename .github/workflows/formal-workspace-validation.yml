name: Formal workspace consolidated validation
on:
  push:
    branches: [formal-ethical-hacking-programme]
    paths:
      - 'scripts/formal-workspace-sdk-compatibility.test.mjs'
      - '.github/workflows/formal-workspace-validation.yml'
      - 'docs/formal-ethical-hacking/authoring/discord-workspace-prototype/**'
      - 'docs/formal-ethical-hacking/prototypes/synthetic-workspace/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: formal-workspace-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install reviewed lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Report and verify installed SDK
        run: node --input-type=module -e "import { version } from 'discord.js'; if (version !== '14.27.0') throw new Error('Review changed SDK'); console.log('discord.js', version);"
      - name: Existing detached workspace, adapters, readers and content tests
        working-directory: docs/formal-ethical-hacking/authoring/discord-workspace-prototype
        run: node --test navigation.test.mjs route-boundary.test.mjs trusted-route.test.mjs adapters.test.mjs trusted-readers.test.mjs cards.test.mjs catalogue.test.mjs readings.test.mjs lab-linux.test.mjs lab-linux-interactions.test.mjs foundation-interactions.test.mjs
      - name: Existing synthetic review and workspace regression
        working-directory: docs/formal-ethical-hacking/prototypes/synthetic-workspace
        run: node --test workspace.test.mjs review.test.mjs review-recovery.test.mjs controls.test.mjs journey.test.mjs action-presenter.test.mjs session-journey.test.mjs authorization.test.mjs build-browser-demo.test.mjs
      - name: Installed SDK compatibility with existing navigation controller
        run: node --test scripts/formal-workspace-sdk-compatibility.test.mjs
