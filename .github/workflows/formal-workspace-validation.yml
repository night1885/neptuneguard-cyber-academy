name: Formal workspace consolidated validation
on:
  push:
    branches: [formal-ethical-hacking-programme, feat/protected-workspace-integration, feat/report-retention-boundaries, feat/no-modal-intake, feat/formal-first-journey-navigation, feat/formal-rendering-audit, feat/formal-reference-navigation, feat/formal-first-practical-integration, main]
    paths:
      - 'formal-*.mjs'
      - 'docs/formal-ethical-hacking/START-HERE.md'
      - 'docs/formal-ethical-hacking/FIRST-PRACTICAL-WORKSHEET.md'
      - 'docs/formal-ethical-hacking/authoring/NAVIGATION-RUNTIME-INTEGRATION.md'
      - 'docs/formal-ethical-hacking/lessons/**'
      - 'certification-course-lifecycle.js'
      - 'certification-account-acknowledgment.js'
      - 'certification-age-declaration.js'
      - 'certification-manual-review-data.mjs'
      - 'scripts/formal-workspace-sdk-compatibility.test.mjs'
      - 'certification-runtime.js'
      - 'restoration.js'
      - 'test-certification-runtime*.mjs'
      - 'test-certification-restored-application.mjs'
      - '.github/workflows/formal-workspace-validation.yml'
      - 'docs/formal-ethical-hacking/authoring/discord-workspace-prototype/**'
      - 'docs/formal-ethical-hacking/prototypes/synthetic-workspace/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'formal-*.mjs'
      - 'docs/formal-ethical-hacking/START-HERE.md'
      - 'docs/formal-ethical-hacking/FIRST-PRACTICAL-WORKSHEET.md'
      - 'docs/formal-ethical-hacking/authoring/NAVIGATION-RUNTIME-INTEGRATION.md'
      - 'docs/formal-ethical-hacking/lessons/**'
      - 'certification-course-lifecycle.js'
      - 'certification-account-acknowledgment.js'
      - 'certification-age-declaration.js'
      - 'certification-manual-review-data.mjs'
      - 'scripts/formal-workspace-sdk-compatibility.test.mjs'
      - 'certification-runtime.js'
      - 'restoration.js'
      - 'test-certification-runtime*.mjs'
      - 'test-certification-restored-application.mjs'
      - '.github/workflows/formal-workspace-validation.yml'
      - 'docs/formal-ethical-hacking/authoring/discord-workspace-prototype/**'
      - 'docs/formal-ethical-hacking/prototypes/synthetic-workspace/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: formal-workspace-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install reviewed lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check startup source without starting the bot
        run: node --check restoration.js
      - name: Report and verify installed SDK
        run: node --input-type=module -e "import { version } from 'discord.js'; if (version !== '14.27.0') throw new Error('Review changed SDK'); console.log('discord.js', version);"
      - name: Actual runtime admission and shutdown regressions
        run: node --test test-certification-runtime.mjs test-certification-runtime-course-authorization.mjs test-certification-runtime-formal-review.mjs test-certification-runtime-formal-stack.mjs test-certification-restored-application.mjs
      - name: Existing detached workspace, adapters, readers and content tests
        working-directory: docs/formal-ethical-hacking/authoring/discord-workspace-prototype
        run: node --test navigation.test.mjs route-boundary.test.mjs trusted-route.test.mjs general-chat-ui-review.test.mjs adapters.test.mjs trusted-readers.test.mjs cards.test.mjs catalogue.test.mjs readings.test.mjs lab-linux.test.mjs lab-linux-interactions.test.mjs foundation-interactions.test.mjs
      - name: Existing synthetic review and workspace regression
        working-directory: docs/formal-ethical-hacking/prototypes/synthetic-workspace
        shell: bash
        run: |
          node --version
          set +e
          node --test --test-reporter=tap workspace.test.mjs review.test.mjs review-recovery.test.mjs controls.test.mjs journey.test.mjs first-journey-rehearsal.test.mjs action-presenter.test.mjs session-journey.test.mjs authorization.test.mjs build-browser-demo.test.mjs report-retention.test.mjs no-modal-intake.test.mjs 2>&1 | tee "$RUNNER_TEMP/formal-synthetic.log"
          codes=("${PIPESTATUS[@]}")
          set -e
          status=${codes[0]}
          if [ "$status" -eq 0 ] && [ "${codes[1]}" -ne 0 ]; then status=${codes[1]}; fi
          if [ "$status" -ne 0 ]; then
            node --input-type=module <<'NODE' || true
          import { readFileSync } from 'node:fs';
          const lines = readFileSync(process.env.RUNNER_TEMP + '/formal-synthetic.log', 'utf8').split(/\r?\n/);
          const failed = lines.map((line, index) => /^\s*not ok\b/.test(line) ? index : -1).filter(index => index >= 0);
          const starts = failed.length ? failed.slice(0, 3) : [0];
          for (const start of starts) {
            let text = lines.slice(start, start + 32).join('\n')
              .replace(/postgres(?:ql)?:\/\/[^\s'"<>]+/gi, '[redacted-connection-url]')
              .replace(/\bPASSWORD\s+'[^']*'/gi, "PASSWORD '[redacted]'").slice(0, 6000);
            text = text.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            console.log('::error title=Synthetic regression failure::' + text);
          }
          NODE
          fi
          exit "$status"
      - name: Installed SDK compatibility with existing navigation controller
        run: node --test scripts/formal-workspace-sdk-compatibility.test.mjs
      - name: Default-off candidate, actual lesson text and installed SDK/service contract
        run: node --test --test-reporter=tap --test-concurrency=1 formal-first-journey-navigation.test.mjs formal-first-journey-source.test.mjs formal-first-journey-compatibility.test.mjs formal-first-journey-references.test.mjs formal-first-journey-reference-source.test.mjs formal-first-practical-runtime.test.mjs formal-first-practical-source.test.mjs formal-first-practical-sdk.test.mjs
      - name: Bounded draft rendering audit tests
        run: node --test --test-reporter=tap formal-render-audit.test.mjs
      - name: Draft source rendering findings (not release approval)
        if: ${{ !cancelled() }}
        run: node formal-render-audit-cli.mjs
