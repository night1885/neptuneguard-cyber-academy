name: Student navigation refactor dry run
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/student-navigation-dry-run.yml']
permissions:
  contents: read
jobs:
  navigation-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_TOKEN: ''
      DATABASE_URL: ''
      CERTIFICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply candidate only in disposable checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          for name, expected in [('index.js', 'caed845fa6e0c93f0382e9676f92f0056190c96b'), ('certification-student-entry.js', '44896b5fb595970f5d403ecc59bd0b36f4ffb810')]:
              data = Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected, f'{name}: reviewed source changed; stop and rebase candidate'
          Path('certification-student-entry.js').write_text('''import { initialConsoleEntry } from './certification-initial-console.js';
          const eligibleEntries = new WeakSet();
          export function withStudentEntry(interaction, guildId, ready) {
            if (!ready || !interaction.isChatInputCommand?.() || interaction.commandName !== 'start' || interaction.guildId !== guildId) return interaction;
            const wrapped = new Proxy(interaction, {
              get(original, key) {
                const value = Reflect.get(original, key, original);
                return typeof value === 'function' ? value.bind(original) : value;
              }
            });
            eligibleEntries.add(wrapped);
            return wrapped;
          }
          export function replyStudentStart(interaction, payload) {
            if (eligibleEntries.has(interaction) && !payload.components?.length) {
              payload = { ...payload, components: [initialConsoleEntry()], allowedMentions: { parse: [] } };
            }
            return interaction.editReply(payload);
          }
          ''')
          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text()
              assert source.count(old) == 1, f'{path}: expected exactly one matching integration point'
              file.write_text(source.replace(old, new, 1))
          replace_once('index.js', "import { createAcademyApplication } from './certification-academy-application.js';", "import { createAcademyApplication } from './certification-academy-application.js';\nimport { replyStudentStart } from './certification-student-entry.js';")
          replace_once('index.js', "if (interaction.commandName === 'start') {\n      await ensureProfile(interaction.user.id);\n\n      await interaction.editReply({", "if (interaction.commandName === 'start') {\n      await ensureProfile(interaction.user.id);\n\n      await replyStudentStart(interaction, {")
          for path in ['test-certification-student-entry.mjs', 'test-certification-start-integration.mjs']:
              replace_once(path, "import { withStudentEntry } from './certification-student-entry.js';", "import { withStudentEntry, replyStudentStart } from './certification-student-entry.js';")
          replace_once('test-certification-student-entry.mjs', 'await withStudentEntry(f.interaction, guild, true).editReply(welcome);', 'await replyStudentStart(withStudentEntry(f.interaction, guild, true), welcome);')
          replace_once('test-certification-start-integration.mjs', "const handler = runInNewContext('(' + handlerSource + ')', {", "const handler = runInNewContext('(' + handlerSource + ')', { replyStudentStart,")
          with Path('test-certification-student-entry.mjs').open('a') as file:
              file.write('''
          test('explicit start success survives changed welcome wording', async () => {
            const f = fixture();
            const payload = { content: 'A completely revised welcome.' };
            await replyStudentStart(withStudentEntry(f.interaction, guild, true), payload);
            assert.equal(payload.components, undefined);
            assert.equal(f.replies[0].content, payload.content);
            assert.deepEqual(f.replies[0].components[0].toJSON().components.map(c => c.custom_id), ['cert:initial:home', 'cert:learner:home']);
          });
          test('explicit helper respects readiness and existing controls', async () => {
            const f = fixture();
            const payload = { content: 'Ready' };
            await replyStudentStart(withStudentEntry(f.interaction, guild, false), payload);
            assert.equal(f.replies.at(-1), payload);
            const existing = { content: 'Ready', components: [{ type: 1 }] };
            await replyStudentStart(withStudentEntry(f.interaction, guild, true), existing);
            assert.equal(f.replies.at(-1), existing);
          });
          test('ordinary welcome reply is not implicitly decorated', async () => {
            const f = fixture();
            await withStudentEntry(f.interaction, guild, true).editReply(welcome);
            assert.equal(f.replies[0], welcome);
          });
          ''')
          PY
      - name: Check candidate syntax
        run: node --check index.js && node --check certification-student-entry.js
      - name: Run certification tests against candidate
        run: node --test test-certification-*.mjs
