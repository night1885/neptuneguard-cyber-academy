name: Bug Bounty consolidated integration validation
'on':
  push:
    branches: ['content/bug-bounty-full-course-2026-11-13']
    paths: ['bug-bounty-reading.mjs', 'test-bug-bounty-*.mjs', 'docs/bug-bounty/reader-source-lock.json', 'certification-course-sections.js', 'certification-student-course-renderer.js', '.github/workflows/bug-bounty-integration.yml', '.github/workflows/manual-review-failure-capture.yml']
permissions:
  contents: read
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[bug-bounty-integration]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20'
            postgres: '16'
          - node: '22'
            postgres: '18'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: bug_bounty_ci
          POSTGRES_PASSWORD: disposable_ci_fixture_only
          POSTGRES_DB: certification_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bug_bounty_ci -d certification_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CERTIFICATION_TEST_DATABASE_URL: postgresql://bug_bounty_ci:disposable_ci_fixture_only@127.0.0.1:5432/certification_test
      CERTIFICATION_TEST_ALLOW_ROLE_DDL: 'true'
      CERTIFICATION_TEST_ALLOW_MANUAL_REVIEW_DDL: 'true'
      CERTIFICATION_TEST_ALLOW_MANUAL_REVIEW_DECISION_DDL: 'true'
      CERTIFICATION_TEST_ALLOW_LAB_DDL: 'true'
      CERTIFICATION_ENABLED: 'false'
      DISCORD_TOKEN: ''
      DATABASE_URL: ''
      CERTIFICATION_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Candidate, installed SDK, native navigation and migrated database regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence
          node --test --test-concurrency=1 --test-reporter=tap \
            test-bug-bounty-reader.mjs test-bug-bounty-native.mjs test-bug-bounty-postgres.mjs \
            test-certification-course-sections.mjs test-certification-course-navigation.mjs \
            test-certification-student-course-renderer.mjs test-certification-programme-reading.mjs \
            test-certification-button-only-course-entry.mjs test-certification-button-only-runtime.mjs \
            test-certification-course-runtime.mjs test-certification-course-admin.mjs \
            test-certification-admin-completion-runtime.mjs test-certification-admin-completion-combined.mjs \
            test-certification-course-request-runtime.mjs test-certification-course-request-ui.mjs \
            test-certification-course-lifecycle.mjs test-certification-course-readiness.mjs \
            test-certification-course-column-privileges.mjs test-certification-course-requests.mjs \
            test-certification-combined-course-cards.mjs test-certification-course-card-curriculum.mjs \
            test-academy-course-card-*.mjs test-community-learning-router.mjs \
            formal-programme-study-workflow.test.mjs \
            2>&1 | tee candidate-evidence/required-tests.tap
          grep -Eq '^# skipped 0$' candidate-evidence/required-tests.tap
          grep -Eq '^# fail 0$' candidate-evidence/required-tests.tap
      - name: Retain actual results, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bug-bounty-integration-node${{ matrix.node }}-pg${{ matrix.postgres }}
          path: candidate-evidence/
          if-no-files-found: warn
          retention-days: 7
