name: Administrator review composition regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  administrator-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - shell: bash
        run: |
          set -euo pipefail
          node --check formal-review-composition.mjs
          node --test test-certification-formal-review-composition.mjs test-certification-formal-review-recovery-composition.mjs test-certification-formal-review-administrator-composition.mjs 2>&1 | tee "$RUNNER_TEMP/admin-composition.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/admin-composition.tap"
