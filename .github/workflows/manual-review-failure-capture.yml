name: Manual-review PostgreSQL 16 failure capture
'on':
  push:
    branches: ['content/bug-bounty-full-course-2026-11-13']
    paths: ['.github/workflows/manual-review-failure-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    if: contains(github.event.head_commit.message, '[pg16-capture]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      context: ${{ steps.exact.outputs.context }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: manual_review_ci
          POSTGRES_PASSWORD: disposable_ci_fixture_only
          POSTGRES_DB: certification_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U manual_review_ci -d certification_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CERTIFICATION_TEST_DATABASE_URL: postgresql://manual_review_ci:disposable_ci_fixture_only@127.0.0.1:5432/certification_test
      CERTIFICATION_TEST_ALLOW_MANUAL_REVIEW_DDL: 'true'
      CERTIFICATION_ENABLED: 'false'
      CERTIFICATION_DATABASE_URL: ''
      DATABASE_URL: ''
      DISCORD_TOKEN: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unchanged exact acceptance tests and retain bounded evidence
        id: exact
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, tempfile
          from pathlib import Path
          out=Path('pg16-evidence');out.mkdir(exist_ok=True)
          def classify(stage, filename, text):
              codes=re.findall(r"\bcode:\s*['\"]([A-Z0-9_]{1,40})['\"]",text)
              code=next((c for c in codes if c!='ERR_TEST_FAILURE'),'ERR_TEST_FAILURE')
              if not re.fullmatch(r'[0-9A-Z]{5}|ERR_ASSERTION|ERR_MODULE_NOT_FOUND|ERR_TEST_FAILURE',code):code='unknown'
              numbers=list(dict.fromkeys(re.findall(re.escape(filename)+r':([0-9]{1,5})(?::[0-9]{1,5})?',text)))[:4]
              location='L'+'-'.join(numbers or ['0'])
              match=re.search(r'(?m)^\s+failureType:\s*([A-Za-z]+)',text)
              kind=match[1] if match and match[1] in {'testCodeFailure','testTimeoutFailure','cancelledByParent','uncaughtException','unhandledRejection'} else 'unknown'
              return f'pg16_{stage}_{location}_{code}_{kind}'
          context,status,records='pg16_ready',0,[]
          for stage,filename in [('migration','test-certification-manual-review-postgres.mjs'),('native','test-certification-manual-review-native-postgres.mjs')]:
              timed_out=False
              with tempfile.TemporaryFile() as output:
                  try:
                      result=subprocess.run(['node','--test',filename],stdout=output,stderr=subprocess.STDOUT,timeout=120)
                      code=result.returncode
                  except subprocess.TimeoutExpired:
                      timed_out=True;code=1
                  output.seek(0);text=output.read(262144).decode('utf-8',errors='replace')
              text=re.sub(r"postgres(?:ql)?://[^\s'\"]+",'<redacted-postgres-url>',text)
              text=re.sub(r'(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b','<redacted-fixture-uuid>',text)
              text=text.replace('disposable_ci_fixture_only','<disposable-fixture-password>')
              (out/(stage+'.tap')).write_text(text,encoding='utf-8')
              totals={k:int(v) for k,v in re.findall(r'^# (tests|pass|fail|cancelled|skipped) ([0-9]+)\s*$',text,re.M)}
              passed=code==0 and not timed_out and totals.get('tests',0)>0 and all(totals.get(k)==0 for k in ['fail','cancelled','skipped'])
              records.append({'stage':stage,'file':filename,'exit_code':code,'totals':totals,'passed':passed})
              if not passed:
                  context=f'pg16_{stage}_timeout' if timed_out else classify(stage,filename,text)
                  status=1;break
          assert re.fullmatch(r'[A-Za-z0-9_-]{1,180}',context)
          (out/'summary.json').write_text(json.dumps({'context':context,'stages':records},indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:f.write('context='+context+'\n')
          print(context)
          sys.exit(status)
          PY
      - name: Keep diagnostic evidence even when acceptance fails
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: manual-review-pg16-evidence-${{ github.run_id }}
          path: pg16-evidence/
          if-no-files-found: warn
          retention-days: 7
  diagnostic_context:
    name: PG16 acceptance (${{ needs.capture.outputs.context || 'missing' }})
    needs: capture
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          CONTEXT: ${{ needs.capture.outputs.context }}
          RESULT: ${{ needs.capture.result }}
        run: |
          printf '%s\n' "$CONTEXT"
          test -n "$CONTEXT"
          test "$RESULT" = success
